name: documind

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://documind:documind@postgres:5432/documind
  REDIS_URL: redis://redis:6379/0
  INGESTION_MODE: celery
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-documind}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-documind-secret}
  S3_BUCKET: documind
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32-bytes!!}
  LOG_JSON: "true"
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_MODEL: ${LLM_MODEL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
  RERANKER: ${RERANKER:-lexical}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports: ["${POSTGRES_PORT:-5442}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6389}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    # The official minio/minio image is no longer pullable from Docker Hub; override as needed.
    image: ${MINIO_IMAGE:-coollabsio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-documind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-documind-secret}
    ports: ["${MINIO_PORT:-9010}:9000", "${MINIO_CONSOLE_PORT:-9011}:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment: *backend-env
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 20s
      timeout: 10s
      retries: 5

  seed:
    build: ./backend
    command: python -m app.seed
    environment: *backend-env
    restart: "no"
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
